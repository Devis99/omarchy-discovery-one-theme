# Discovery One — a dark, architectural palette inspired by 2001: A Space Odyssey
mode = "dark"

accent = "#2b8ae6"
selection = "#143f3d"
selection_foreground = "#c8e2d2"
muted = "#758789"

background = "#111d1f"
dark_background = "#051214"
darker_background = "#010709"
lighter_background = "#1a292c"

foreground = "#d6d1bf"
dark_foreground = "#7e9495"
light_foreground = "#e5e1d3"
